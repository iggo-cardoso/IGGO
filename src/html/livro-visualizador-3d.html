<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sessenta Vezes por Segundo — Visualizador 3D</title>
<style>
  :root {
    --front-w: 340px;
    --front-h: 458px;
    --spine-w: 22px;
    --bg: #000;
    --bg-2: #000;
    --ember: #c2571f;
    --paper: #f4ede4;
    --muted: #8a8177;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(ellipse at 50% 30%, var(--bg-2), var(--bg) 70%);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    color: var(--paper);
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    perspective: 2200px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    cursor: grab;

    &.grabbing {
      cursor: grabbing;
    }
  }

  .eyebrow {
    position: absolute;
    top: 34px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;

    & strong {
      display: block;
      margin-top: 4px;
      font-size: 20px;
      letter-spacing: 0.02em;
      color: var(--paper);
      font-weight: 600;
    }
  }

  .scene {
    width: var(--front-w);
    height: var(--front-h);
    position: relative;
    transform-style: preserve-3d;
    filter: drop-shadow(0 40px 60px rgba(0,0,0,0.55));
  }

  .book {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transform: rotateY(-28deg) rotateX(4deg);
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);

    &.dragging {
      transition: none;
    }
  }

  .face {
    position: absolute;
    top: 0;
    overflow: hidden;
    background-size: cover;
    background-position: center;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);

    & img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
  }

  .face-shade {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .front {
    width: var(--front-w);
    height: var(--front-h);
    left: 0;
    transform: translateZ(calc(var(--spine-w) / 2));
    border-radius: 1px 3px 3px 1px;

    & .face-shade {
      background: linear-gradient(115deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.22) 100%);
    }
  }

  .back {
    width: var(--front-w);
    height: var(--front-h);
    left: 0;
    transform: rotateY(180deg) translateZ(calc(var(--spine-w) / 2));

    & .face-shade {
      background: linear-gradient(245deg, rgba(255,255,255,0.06) 0%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.3) 100%);
    }
  }

  .spine {
    width: var(--spine-w);
    height: var(--front-h);
    left: calc((var(--front-w) - var(--spine-w)) / 2);
    transform: rotateY(-90deg) translateZ(calc(var(--front-w) / 2));

    & .face-shade {
      background: linear-gradient(90deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 80%, rgba(0,0,0,0.35) 100%);
    }
  }

  .pages {
    width: var(--spine-w);
    height: var(--front-h);
    left: calc((var(--front-w) - var(--spine-w)) / 2);
    transform: rotateY(90deg) translateZ(calc(var(--front-w) / 2));
    background: repeating-linear-gradient(
      90deg,
      #efe6d8 0px,
      #e4d9c7 1px,
      #efe6d8 2px,
      #f6efe3 3px
    );

    & .face-shade {
      background: linear-gradient(90deg, rgba(0,0,0,0.28) 0%, rgba(0,0,0,0) 15%, rgba(0,0,0,0) 85%, rgba(0,0,0,0.28) 100%);
    }
  }

  .top, .bottom {
    width: var(--front-w);
    height: var(--spine-w);
    left: 0;
    top: calc((var(--front-h) - var(--spine-w)) / 2);
    background: repeating-linear-gradient(
      0deg,
      #efe6d8 0px,
      #e4d9c7 1px,
      #efe6d8 2px
    );
  }

  .top {
    transform: rotateX(90deg) translateZ(calc(var(--front-h) / 2));
  }

  .bottom {
    transform: rotateX(-90deg) translateZ(calc(var(--front-h) / 2));
  }

  .ground {
    position: absolute;
    bottom: -46px;
    left: 50%;
    width: 260px;
    height: 40px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 70%);
    filter: blur(2px);
  }

  .controls {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 5;
  }

  .btn {
    appearance: none;
    border: 1px solid rgba(244,237,228,0.18);
    background: rgba(244,237,228,0.06);
    color: var(--paper);
    font-size: 12px;
    letter-spacing: 0.04em;
    padding: 9px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    backdrop-filter: blur(6px);

    &:hover {
      background: rgba(244,237,228,0.14);
      border-color: rgba(244,237,228,0.32);
    }

    &:active {
      transform: scale(0.96);
    }

    &.active {
      background: var(--ember);
      border-color: var(--ember);
      color: #1a0e06;
      font-weight: 600;
    }
  }

  .hint {
    position: absolute;
    bottom: 92px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 6px;
    opacity: 0.85;
  }
</style>
</head>

  <div class="ground"></div>

  <div class="hint">Arraste para girar</div>
  <div class="controls">
    <button class="btn" data-angle="0">Capa</button>
    <button class="btn" data-angle="-90">Lombada</button>
    <button class="btn" data-angle="180">Contracapa</button>
    <button class="btn" id="autoBtn" data-auto="1">Girar</button>
  </div>
</div>

<script>
(function () {
  const stage = document.getElementById('stage');
  const book = document.getElementById('book');
  const buttons = document.querySelectorAll('.controls .btn[data-angle]');
  const autoBtn = document.getElementById('autoBtn');

  let currentY = -28;
  let currentX = 4;
  let dragging = false;
  let startX = 0, startY = 0;
  let startRotY = currentY, startRotX = currentX;
  let autoRotate = false;
  let autoRAF = null;

  function apply(y, x, animated) {
    book.style.transition = animated ? 'transform 0.6s cubic-bezier(0.22, 1, 0.36, 1)' : 'none';
    book.style.transform = 'rotateY(' + y + 'deg) rotateX(' + x + 'deg)';
  }

  apply(currentY, currentX, false);

  function stopAuto() {
    autoRotate = false;
    autoBtn.classList.remove('active');
    autoBtn.textContent = 'Girar';
    if (autoRAF) cancelAnimationFrame(autoRAF);
  }

  function startAuto() {
    autoRotate = true;
    autoBtn.classList.add('active');
    autoBtn.textContent = 'Parar';
    let last = performance.now();
    function step(now) {
      if (!autoRotate) return;
      const dt = now - last;
      last = now;
      currentY += dt * 0.02;
      apply(currentY, currentX, false);
      autoRAF = requestAnimationFrame(step);
    }
    autoRAF = requestAnimationFrame(step);
  }

  autoBtn.addEventListener('click', function () {
    if (autoRotate) { stopAuto(); } else { stopAuto(); startAuto(); }
  });

  buttons.forEach(function (b) {
    b.addEventListener('click', function () {
      stopAuto();
      buttons.forEach(function (o) { o.classList.remove('active'); });
      b.classList.add('active');
      currentY = parseFloat(b.getAttribute('data-angle'));
      currentX = 4;
      apply(currentY, currentX, true);
    });
  });

  function pointerDown(x, y) {
    stopAuto();
    dragging = true;
    stage.classList.add('grabbing');
    startX = x; startY = y;
    startRotY = currentY; startRotX = currentX;
    book.classList.add('dragging');
  }

  function pointerMove(x, y) {
    if (!dragging) return;
    const dx = x - startX;
    const dy = y - startY;
    currentY = startRotY + dx * 0.35;
    currentX = Math.max(-30, Math.min(30, startRotX - dy * 0.2));
    apply(currentY, currentX, false);
  }

  function pointerUp() {
    dragging = false;
    stage.classList.remove('grabbing');
    book.classList.remove('dragging');
  }

  stage.addEventListener('mousedown', function (e) { pointerDown(e.clientX, e.clientY); });
  window.addEventListener('mousemove', function (e) { pointerMove(e.clientX, e.clientY); });
  window.addEventListener('mouseup', pointerUp);

  stage.addEventListener('touchstart', function (e) {
    const t = e.touches[0];
    pointerDown(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    const t = e.touches[0];
    pointerMove(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('touchend', pointerUp);

  startAuto();
})();
</script>
